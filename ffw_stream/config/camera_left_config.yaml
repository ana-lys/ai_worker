/**:
  ros__parameters:
    target_ip: "192.168.0.241"
    target_port_rgb: 8080
    target_port_depth: 8082
    target_port_ir: 8084
    target_port_metadata: 8089
    
    # Left Camera Device ID
    device_id: ""

    # Which streams to enable
    enable_rgb: false
    enable_depth: true
    enable_ir: false

    # RGB settings (Ignored since enable_rgb is false)
    rgb_width: 640
    rgb_height: 480
    rgb_format: "RGB8"
    rgb_fps: 15

    # Depth settings
    depth_width: 640
    depth_height: 480
    depth_format: "Z16"
    depth_fps: 15

    # IR settings (480x270 fits USB 2.0 bandwidth at 30fps)
    ir_width: 480
    ir_height: 270
    ir_format: "Y8"
    ir_fps: 30
